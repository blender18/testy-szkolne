<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Nauka - Historia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style_nauka.css">
</head>
<body>

<header>
    <section class="header-section">
        <div class="header-subsection">
            <a href="index.html">Szkoła Quizy</a>
            <a href="">Egzaminy Praktyczne</a>
            <a href="">Egzaminy Teoretyczne</a>
        </div>
    </section>
</header>

<div class="quiz-wrapper">
    <div class="quiz-box">

        <div class="quiz-title">
            Historia – Nauka
        </div>

        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <div class="question-number" id="questionNumber"></div>

        <div class="question-text" id="questionText"></div>

        <div class="answer-static" id="answerText"></div>

        <div class="quiz-bottom">
            <button class="btn" id="prevBtn">Poprzednie</button>

            <button class="btn" id="nextBtn">Następne</button>
        </div>

    </div>
</div>

<script>
const Q = [
    {
        q: "Kiedy podpisano traktat wersalski określający warunki pokoju z Niemcami po I wojnie światowej?",
        a: "28 czerwca 1919 r."
    },
    {
        q: "Jakie tereny Niemcy utraciły na rzecz Polski na mocy traktatu wersalskiego?",
        a: "Wielkopolskę i Pomorze Gdańskie"
    },
    {
        q: "Z którym państwem zawarto w 1920 r. traktat w Trianon, na mocy którego państwo to straciło ok. 2/3 swojego przedwojennego terytorium?",
        a: "Z Węgrami"
    },
    {
        q: "Kto po I wojnie obalił sułtana, obronił część ziem tureckich przed Grekami i został pierwszym prezydentem Republiki Turcji, zyskując przydomek Atatürk?",
        a: "Mustafa Kemal Pasza"
    },
    {
        q: "Jakie wydarzenie z lat 1915–1917 w imperium osmańskim jest uznawane za pierwsze ludobójstwo XX wieku?",
        a: "Rzeź Ormian"
    },
    {
        q: "Jak nazywała się organizacja międzynarodowa powołana w Genewie po I wojnie światowej, mająca zapobiegać konfliktom i strzec pokoju?",
        a: "Liga Narodów"
    },
    {
        q: "Dlaczego wpływ Ligi Narodów na sytuację światową szybko okazał się znikomy?",
        a: "Bo Stany Zjednoczone ostatecznie do niej nie przystąpiły"
    },
    {
        q: "Czego dotyczył tzw. mały traktat wersalski narzucony nowym państwom (m.in. Polsce)?",
        a: "Gwarancji poszanowania i ochrony praw mniejszości narodowych"
    },
    {
        q: "W którym roku komuniści oficjalnie ogłosili utworzenie Związku Socjalistycznych Republik Sowieckich (ZSRS)?",
        a: "1922 r."
    },
    {
        q: "Jaką politykę gospodarczą wprowadził Lenin w 1921 r. (NEP), aby ratować zrujnowaną rosyjską gospodarkę?",
        a: "Nową Politykę Ekonomiczną, dopuszczającą pewną wolność handlu i prywatne firmy"
    },
    {
        q: "Czym była zapoczątkowana przez Stalina kolektywizacja rolnictwa?",
        a: "Przymusowym łączeniem prywatnych gospodarstw chłopskich w wielkie państwowe kołchozy i sowchozy"
    },
    {
        q: "Co było bezpośrednim skutkiem przymusowej kolektywizacji i rekwizycji zboża na Ukrainie w latach 1932-1933?",
        a: "Sztucznie wywołany Wielki Głód, który pochłonął miliony ofiar"
    },
    {
        q: "Jak nazywano system łagrów – sowieckich obozów pracy przymusowej i koncentracyjnych?",
        a: "Gułag"
    },
    {
        q: "Kto stał się niekwestionowanym przywódcą ZSRS po śmierci Lenina w 1924 roku, eliminując powoli swoich politycznych rywali?",
        a: "Józef Stalin"
    },
    {
        q: "Jak komuniści nazywali przyspieszoną i przymusową rozbudowę przemysłu ciężkiego opartą na planach pięcioletnich?",
        a: "Industrializacja"
    },
    {
        q: "Czym charakteryzował się wprowadzany w ZSRS 'kult jednostki'?",
        a: "Oddawaniem boskiej czci Leninowi, a następnie Stalinowi jako genialnym ojcom narodu"
    },
    {
        q: "Co stało się z Lwem Trockim, jednym z głównych twórców rewolucji i rywalem Stalina?",
        a: "Został skazany na wygnanie, a w 1940 r. zamordowany przez sowieckiego agenta w Meksyku"
    },
    {
        q: "Czym był powołany w Moskwie w 1919 r. Komintern (Międzynarodówka Komunistyczna)?",
        a: "Organizacją koordynującą partie komunistyczne na świecie w celu wzniecenia globalnej rewolucji"
    },
    {
        q: "Z jakim dawnym wrogiem Rosja Sowiecka podpisała w 1922 r. traktat w Rapallo, łamiąc izolację polityczną i rozpoczynając tajną współpracę militarną?",
        a: "Z Niemcami (Republiką Weimarską)"
    },
    {
        q: "W czasie tzw. stalinowskich czystek w latach 1937–1938, w ramach których 'operacji narodowościowej' rozstrzelano ponad 110 tys. ofiar podejrzanych m.in. o szpiegostwo?",
        a: "W operacji polskiej NKWD"
    },
    {
        q: "Jaki był cel idei 'Paneuropy' promowanej w okresie międzywojennym m.in. przez Richarda Coudenhove-Kalergi?",
        a: "Utworzenie Stanów Zjednoczonych Europy i wspólnej waluty, by uniknąć wojen"
    },
    {
        q: "Który niemiecki obszar w pobliżu granic z Francją i Belgią miał zostać, na mocy traktatu wersalskiego, zdemilitaryzowany?",
        a: "Nadrenia"
    },
    {
        q: "Które z wymienionych państw jako JEDYNE NIE powstało/odrodziło się z rozpadu wielkich imperiów zaraz po I wojnie światowej?",
        a: "Hiszpania"
    },
    {
        q: "Gdzie w 1936-1939 r. państwa totalitarne (ZSRS i III Rzesza) wspierały walczące ze sobą frakcje polityczne traktując ten konflikt jako 'poligon doświadczalny'?",
        a: "W wojnie domowej w Hiszpanii"
    },
    {
        q: "Która instytucja nadzorowała aparat terroru i egzekucje na domniemanych 'wrogach ludu' w ZSRS w czasach Wielkiej Czystki (pod wodzą m.in. N. Jeżowa)?",
        a: "NKWD"
    }
];

let current = 0;

function render() {
    const q = Q[current];

    document.getElementById("questionNumber").textContent =
        `${current + 1} / ${Q.length}`;

    document.getElementById("questionText").textContent = q.q;

    document.getElementById("answerText").textContent = q.a;

    document.getElementById("progressFill").style.width =
        ((current + 1) / Q.length) * 100 + "%";
}

document.getElementById("nextBtn").onclick = () => {
    if (current < Q.length - 1) {
        current++;
        render();
    }
};

document.getElementById("prevBtn").onclick = () => {
    if (current > 0) {
        current--;
        render();
    }
};

render();
</script>

</body>
</html>
