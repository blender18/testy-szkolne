<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Relative Clauses – Nauka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style_nauka.css">
</head>
<body>

<header>
    <section class="header-section">
        <div class="header-subsection">
            <a href="index.html">Angielski</a>
            <a href="#">Relative Clauses</a>
            <a href="#">Kartkówka</a>
        </div>
    </section>
</header>

<div class="quiz-wrapper">
    <div class="quiz-box">

        <div class="quiz-title">
            Relative Clauses – Nauka
        </div>

        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <div class="question-number" id="questionNumber"></div>

        <div class="question-text" id="questionText"></div>

        <div class="answer-static" id="answerText"></div>

        <div class="quiz-bottom">
            <button class="btn" id="prevBtn">Poprzednie</button>

            <button class="btn" id="nextBtn">Następne</button>
        </div>

    </div>
</div>

<script>

const Q = [

{
    q: "Kiedy używamy defining relative clauses?",
    a: "Używamy ich do podania informacji koniecznej do zrozumienia zdania.\\n\\nExample:\\nThe boy who lives next door is my friend."
},

{
    q: "Jakich zaimków używamy w defining relative clauses?",
    a: "WHO → ludzie\\nWHICH → rzeczy i zwierzęta\\nTHAT → ludzie i rzeczy\\nWHERE → miejsca\\nWHOSE → przynależność"
},

{
    q: "Kiedy używamy WHO?",
    a: "WHO używamy do ludzi.\\n\\nExample:\\nThe girl who called you is my sister."
},

{
    q: "Kiedy używamy WHICH?",
    a: "WHICH używamy do rzeczy i zwierząt.\\n\\nExample:\\nThe phone which I bought is expensive."
},

{
    q: "Kiedy używamy THAT?",
    a: "THAT może zastąpić WHO i WHICH w defining clauses.\\n\\nExample:\\nThe car that I drive is very fast."
},

{
    q: "Kiedy używamy WHERE?",
    a: "WHERE używamy do miejsc.\\n\\nExample:\\nThis is the school where I study."
},

{
    q: "Kiedy używamy WHOSE?",
    a: "WHOSE pokazuje przynależność.\\n\\nExample:\\nThe boy whose bike was stolen is sad."
},

{
    q: "Kiedy można pominąć who / which / that?",
    a: "Można je pominąć, gdy NIE są podmiotem zdania.\\n\\n✔ I know the girl who you met.\\n✔ I know the girl you met."
},

{
    q: "Czym są non-defining relative clauses?",
    a: "Dodają dodatkową informację.\\nOddzielamy je przecinkami.\\n\\nExample:\\nMy brother, who lives in London, is a doctor."
},

{
    q: "Jakich zaimków używamy w non-defining clauses?",
    a: "WHO\\nWHICH\\nWHERE\\nWHOSE\\n\\n❌ NIE używamy THAT"
},

{
    q: "Dlaczego w non-defining clauses nie używamy THAT?",
    a: "Bo THAT jest tam niepoprawne gramatycznie.\\n\\n✔ My car, which is very old, still works.\\n❌ My car, that is very old, still works."
},

{
    q: "Czy można usuwać zaimki w non-defining clauses?",
    a: "Nie.\\n\\n✔ My uncle, who lives in Paris, is rich.\\n❌ My uncle, lives in Paris, is rich."
},

{
    q: "Jaka jest różnica między defining i non-defining clauses?",
    a: "DEFINING → informacja konieczna, bez przecinków.\\n\\nNON-DEFINING → informacja dodatkowa, z przecinkami."
},

{
    q: "Przykład defining relative clause",
    a: "Students who study regularly get good grades."
},

{
    q: "Przykład non-defining relative clause",
    a: "Tom, who studies regularly, gets good grades."
},

{
    q: "Jak wygląda relative clause z WHERE?",
    a: "This is the restaurant where we ate dinner.\\n\\nMożna też:\\nThis is the restaurant in which we ate dinner."
},

{
    q: "Jak wygląda relative clause z WHOSE?",
    a: "The woman whose dog is barking is angry."
},

{
    q: "Najważniejsze zasady na kartkówkę",
    a: "✔ WHO → ludzie\\n✔ WHICH → rzeczy\\n✔ THAT → ludzie i rzeczy (tylko defining)\\n✔ WHERE → miejsca\\n✔ WHOSE → przynależność\\n\\n✔ defining = bez przecinków\\n✔ non-defining = przecinki\\n\\n✔ w non-defining NIE używamy THAT"
}

];

let current = 0;

function render() {

    const q = Q[current];

    document.getElementById("questionNumber").textContent =
        `${current + 1} / ${Q.length}`;

    document.getElementById("questionText").textContent = q.q;

    document.getElementById("answerText").textContent = q.a;

    document.getElementById("progressFill").style.width =
        ((current + 1) / Q.length) * 100 + "%";
}

document.getElementById("nextBtn").onclick = () => {

    if (current < Q.length - 1) {
        current++;
        render();
    }
};

document.getElementById("prevBtn").onclick = () => {

    if (current > 0) {
        current--;
        render();
    }
};

render();

</script>

</body>
</html>
